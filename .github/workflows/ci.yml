name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore

      # Analyzer rules already fail the build as errors, so this step only needs to cover whitespace and layout.
      - name: Check formatting
        run: dotnet format whitespace Dotnetstore.JournalSystem.slnx --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Debug

      # The E2E tests drive Chromium; the browser's OS dependencies are not on the runner by default.
      - name: Install Playwright browser dependencies
        run: pwsh tests/Dotnetstore.JournalSystem.FrontEnd.WebUi.E2ETests/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium

      # Integration and E2E tests start SQL Server through Testcontainers, which the runner's Docker provides.
      - name: Test
        run: dotnet test --no-build --configuration Debug
